<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Save Dates</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand">
        <h1>Save Dates</h1>
        <p class="hello" id="hello"></p>
        <p class="lede" data-i18n="lede"></p>
      </div>
      <div class="header-tools">
        <div class="status-pill" id="statusCard" role="status">
          <div class="status-dot" id="statusDot"></div>
          <strong id="statusTitle"></strong>
        </div>
        <div class="seg" id="langSeg">
          <button type="button" data-lang="zh">中</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="ghost small" id="settingsBtn" type="button" data-i18n="settings"></button>
      </div>
    </header>
    <p class="status-meta" id="statusMeta"></p>

    <div class="settings-panel hidden" id="settingsPanel">
      <p class="settings-hint" data-i18n="classicHint"></p>
      <label class="lang-box">
        <span data-i18n="backend"></span>
        <select id="backendSelect">
          <option value="auto" data-i18n="backendAuto">自动（优先经典 Outlook）</option>
          <option value="classic" data-i18n="backendClassic">经典 Outlook</option>
          <option value="graph" data-i18n="backendGraph">新 Outlook（进阶）</option>
        </select>
      </label>
      <label>
        <span data-i18n="recent"></span>
        <input id="days" type="number" min="1" max="90" value="14" />
        <span data-i18n="days"></span>
      </label>
      <label>
        <span data-i18n="maxScan"></span>
        <input id="maxEmails" type="number" min="10" max="200" value="80" />
        <span data-i18n="emails"></span>
      </label>
      <label class="check">
        <input id="includeProcessed" type="checkbox" />
        <span data-i18n="includeProcessed"></span>
      </label>
      <details class="advanced-box" id="advancedBox">
        <summary data-i18n="advancedNewOutlook">进阶 · 仅新 Outlook</summary>
        <p class="advanced-help" data-i18n="advancedHelp"></p>
        <div class="tool-row">
          <button class="ghost small" id="msLoginBtn" type="button" data-i18n="loginMs"></button>
          <button class="ghost small hidden" id="msLogoutBtn" type="button" data-i18n="logoutMs"></button>
        </div>
        <details class="graph-setup" id="graphSetup">
          <summary data-i18n="graphOverride"></summary>
          <p data-i18n="graphHelp"></p>
          <label>
            <span data-i18n="graphClientId"></span>
            <input id="graphClientId" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
          </label>
          <div class="tool-row">
            <button class="primary small" id="saveClientId" type="button" data-i18n="saveClientId"></button>
            <a class="help-link" href="https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade" target="_blank" rel="noopener" data-i18n="openEntra"></a>
          </div>
        </details>
      </details>
    </div>

    <section class="toolbar">
      <button class="primary" id="scanBtn" type="button" data-i18n="scanBtn"></button>
      <button class="ghost" id="demoBtn" type="button" data-i18n="demoBtn"></button>
      <label class="search-wrap">
        <input id="mailSearch" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchPlaceholder" />
      </label>
      <div class="counts" id="counts"></div>
    </section>
    <div class="search-panel hidden" id="searchPanel">
      <p class="search-hint" id="searchHint"></p>
      <div id="searchResults"></div>
    </div>

    <div class="lane-row">
      <div class="seg" id="laneSeg">
        <button type="button" data-lane="event" id="laneEventBtn"></button>
        <button type="button" data-lane="task" id="laneTaskBtn"></button>
        <button type="button" data-lane="promo" id="lanePromoBtn"></button>
      </div>
      <div class="seg hidden" id="mailboxSeg"></div>
    </div>

    <div class="banner hidden" id="banner">
      <span id="bannerText"></span>
      <button class="ghost small hidden" id="undoBtn" type="button" data-i18n="undo"></button>
    </div>
    <div class="batch hidden" id="batchBar">
      <span id="selectedCount"></span>
      <button class="primary small" id="batchAccept" type="button" data-i18n="batchAccept"></button>
      <button class="danger small" id="batchReject" type="button" data-i18n="batchReject"></button>
    </div>

    <main id="list" class="list"></main>
    <p class="empty" id="empty" data-i18n="empty"></p>
  </div>
  <div class="modal-overlay hidden" id="connectPicker" role="dialog" aria-modal="true" aria-labelledby="connectPickerTitle">
    <div class="modal" role="document">
      <h2 id="connectPickerTitle" data-i18n="connectPickerTitle"></h2>
      <p class="modal-lede" data-i18n="connectPickerLede"></p>
      <div class="connect-choices">
        <button type="button" class="connect-choice" id="pickClassic">
          <strong data-i18n="pickClassicTitle"></strong>
          <span data-i18n="pickClassicHelp"></span>
        </button>
        <button type="button" class="connect-choice" id="pickGraph">
          <strong data-i18n="pickGraphTitle"></strong>
          <span data-i18n="pickGraphHelp"></span>
        </button>
      </div>
      <button type="button" class="ghost small" id="connectPickerLater" data-i18n="connectPickerLater"></button>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
